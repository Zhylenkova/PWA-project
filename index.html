<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-title" content="FoodCatcher"/>
    <meta name="description" content="FoodCatcher - Twój lokalny przewodnik i łowca smaków."/>
    <title>FoodCatcher — Local Food Explorer</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-inner">
                <div class="topbar-logo">
                    <span class="topbar-logo-icon">📸</span>
                    <h1>Food<span>Catcher</span></h1>
                </div>
            </div>
        </header>

        <main class="content">
            <section id="screen-camera" class="screen active">
                <div class="cam-placeholder">Gotowy do łapania smaków?</div>
            </section>
            
            <section id="screen-map" class="screen">
                <div id="map"></div>
            </section>

            <section id="screen-guide" class="screen">
                <div class="food-grid" id="food-grid"></div>
            </section>
        </main>

        <nav class="tabbar">
            <button class="tab active" onclick="switchTab('camera')">
                <i class="bi bi-camera-fill"></i><span>Aparat</span>
            </button>
            <button class="tab" onclick="switchTab('map')">
                <i class="bi bi-map-fill"></i><span>Mapa</span>
            </button>
            <button class="tab" onclick="switchTab('guide')">
                <i class="bi bi-journal-richtext"></i><span>Przewodnik</span>
            </button>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
